- title: Full or partial service CRO execution
  summary: >-
    Ideal when a program needs a single accountable partner from start-up through
    close-out.
  points:
    - Fully outsourced trial management across all CRO services, with transfer of sponsor obligations.
    - Partially outsourced models with clearly defined transfer of sponsor obligations.
    - Scalable engagement that expands or contracts scope as the program evolves.

- title: Flexible consulting model
  summary: >-
    Targeted advisory support without a full outsourcing commitment.
  points:
    - Advisory boards
    - Clinical development strategy
    - Study design
    - Operational feasibility and project start-up
    - Site feasibility
