- id: investigators
  title: Our Investigators
  body: "PCCTC investigators are internationally recognized leaders from over 300
    of the world's top academic medical centers, and sponsors work with them
    directly. Drawing on their insight into the underlying biology of the
    disease, they developed the universally adopted clinical states model of
    prostate cancer and initiated one of the first efforts in oncology to
    prospectively validate endpoints for definitive phase 3 studies (PCWG2,
    followed by PCWG3), criteria now embedded in trial protocols across the
    field and updated in 2026 with the publication of PCWG4. For a sponsor, this
    means trial designs shaped by the people who wrote the standards: advisory
    input, endpoint strategy, and site-level engagement come from the same
    investigators whose research objectives run through our study portfolio."
- id: ourconsortium
  title: Our Consortium
  body: "Since its inception in 2005, the PCCTC has grown from a network of eight
    preeminent academic institutions to a multinational consortium of more than
    200 participating academic and community-based clinical research sites. For
    sponsors, the consortium is operating infrastructure, not an affiliation:
    standing site relationships, streamlined contracting, and shared processes
    that shorten start-up and sustain accrual. That infrastructure also powers
    consortium-led programs in imaging, blood-based biomarkers, clinical study
    design, germline genetics, and targeted therapy development, so industry
    studies inherit the same platforms academic investigators use to advance the
    field. It now supports a portfolio reaching beyond prostate cancer into a
    diverse array of oncology indications."
- id: drugdevelopment
  title: Therapy Development
  body: "The PCCTC selects and prioritizes development opportunities on three
    tests: our knowledge of the global drug development landscape, the strength
    of the underlying science, and the potential to address critical unmet needs
    across the cancers we study. Close interaction between basic scientists and
    clinical investigators moves promising therapies into early-phase studies
    quickly, while novel study designs, endpoints, and predictive biomarkers
    facilitate efficient, objective decisions around advancing or discontinuing
    a program."
- id: biomarkerdevelopment
  title: Biomarker Development
  body: "The PCCTC develops therapies and biomarkers together. Drugs advance
    faster in precisely defined, biologically relevant patient groups: screening
    for likely responders shortens development timelines and spares patients
    unnecessary toxicity from ineffective treatment. PCCTC investigators have
    shaped how the field measures prostate cancer for more than two decades,
    from the original PSA Working Group eligibility and response guidelines
    through the PCWG2, PCWG3, and PCWG4 criteria that now define PSA-, imaging-,
    and biomarker-based endpoints in trial protocols worldwide, including
    PCWG4's criteria for PSMA-PET. For sponsors, the objective is direct:
    analytically valid assays and clinically validated intermediate endpoints
    that can predict clinical benefit and support accelerated approval."
