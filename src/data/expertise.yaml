- id: investigators
  title: Our Investigators
  body: >-
    PCCTC investigators are internationally recognized leaders from the nation's top
    academic medical centers, and sponsors work with them directly. Drawing on their
    insight into the underlying biology of the disease, they developed the universally
    adopted clinical states model of prostate cancer and initiated one of the first
    efforts in oncology to prospectively validate endpoints for definitive phase 3 studies
    (PCWG2, followed by PCWG3), criteria now embedded in trial protocols across the field.
    For a sponsor, this means trial designs shaped by the people who wrote the standards:
    advisory input, endpoint strategy, and site-level engagement come from the same
    investigators whose research objectives run through our study portfolio.
- id: ourconsortium
  title: Our Consortium
  body: >-
    Since its inception in 2005, the PCCTC has grown from a network of eight preeminent
    academic institutions to a multinational consortium of more than 200 participating
    academic and community-based clinical research sites. For sponsors, the consortium is
    operating infrastructure, not an affiliation: standing site relationships, established
    agreements, and shared processes that shorten start-up and sustain accrual. That
    infrastructure also powers consortium-led programs in imaging, blood-based biomarkers,
    clinical study design, germline genetics, and targeted therapy development, so
    industry studies inherit the same platforms academic investigators use to advance the
    field. It now supports the consortium's first programs beyond prostate cancer,
    beginning with registries in breast and colorectal cancer.
- id: drugdevelopment
  title: Therapy Development
  body: >-
    The PCCTC selects and prioritizes development opportunities on three tests: our
    investigators' read of the global study environment, the strength of the underlying
    science, and the potential to address critical unmet needs across the cancers we
    study. Close interaction between basic scientists and clinical investigators moves
    promising therapies into early-phase studies quickly, while novel study designs,
    endpoints, and predictive biomarkers keep the decision to advance or discontinue a
    program objective and fast. Sponsors get the discipline of a portfolio organization:
    the Management Team and Scientific Oversight Committee jointly resolve the scientific,
    legal, regulatory, database, and budgetary questions of every study so programs keep
    moving.
- id: biomarkerdevelopment
  title: Biomarker Development
  body: >-
    The PCCTC develops therapies and biomarkers together. Drugs advance faster in
    precisely defined, biologically relevant patient groups: screening for likely
    responders shortens development timelines and spares patients unnecessary toxicity
    from ineffective treatment. Following the FDA's Critical Path Initiative, we ran one
    of the first efforts in oncology to define blood- and imaging-based biomarkers, build
    analytically valid assays for them, and conduct the dedicated clinical studies needed
    to establish their clinical validity. The objective for sponsors is direct:
    intermediate and surrogate endpoints that can predict clinical benefit and support
    accelerated approval.
