- title: Ethical research and diversity
  body: >-
    Recognizing the pivotal role of ethical research — particularly with respect to
    considering all forms of diversity, equity, and inclusion — including but not
    limited to people of different socioeconomic status, racial and ethnic background,
    religious or spiritual affiliation, age, gender and sexual identity, career
    experience, people with disabilities, and other underserved groups.
- title: Championing DEI in practice
  body: >-
    Championing diversity, equity, and inclusivity in participant recruitment and
    clinical research practices, including promoting a diverse and inclusive environment
    in clinics as well as on committees and working groups.
- title: Respecting patient autonomy
  body: >-
    Respecting the validity of patients' narratives, background, and experiences while
    protecting privacy and autonomy.
- title: Professional development
  body: >-
    Mentoring and fostering the growth of the next generation of diverse medical and
    research professionals.
