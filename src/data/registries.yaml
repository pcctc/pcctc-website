- name: "IRONMAN: International Registry for Men With Advanced Prostate Cancer"
  condition: "Prostate cancer"
  status: "Active"
  nct: "NCT03151629"
  url: "https://ironmanregistry.org/"
  description: >-
    An international registry for men with advanced prostate cancer. Five PCCTC-run
    substudies have been built on its platform, reusing its sites, contracts, and data
    pipelines.
  substudies:
    - "PRODIGY: Observational study to describe effectiveness of olaparib in subjects with metastatic castration-resistant prostate cancer who have failed prior treatment with a new hormonal agent and carry selected homologous recombination repair gene mutations"
    - "EMPRO: Engaging Men in Patient Reported Outcomes"
    - "BIOGUARD: BIOmarker landscape in GU cancers: Assessment in the Real-worlD"
    - "IRONSeq: Characterizing the whole genome landscape of the IRONMAN Registry"

- name: "PROMISE Registry: A Prostate Cancer Registry of Outcomes and Germline Mutations for Improved Survival and Treatment Effectiveness"
  condition: "Prostate cancer"
  status: "Active"
  nct: "NCT04995198"
  url: "https://www.prostatecancerpromise.org/"
  description: >-
    A PCCTC-managed registry linking germline genetics to outcomes and treatment
    effectiveness for patients with prostate cancer.

- name: "The Reversing Early Recurrence (RER) Registry: A Patient Registry to Characterize Molecular Residual Disease (MRD) and to Facilitate Clinical Trial Patient Identification"
  condition: "Colorectal, breast, and lung cancer"
  status: "In development"
  description: >-
    A PCCTC-managed registry program extending the IRONMAN and PROMISE model to
    colorectal, breast, and lung cancer on the same coordinated infrastructure.
